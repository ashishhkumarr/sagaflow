# the link is public, so one address cannot flood it. an open dashboard tab asks about
# twice a second, which stays well under the first limit. the second one only counts
# POSTs, since an empty key is not limited
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

map $request_method $order_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $order_key zone=orders:10m rate=20r/m;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # the trailing slash matters, it strips /api so /api/orders reaches /orders
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=orders burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://order-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
