server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
  jpa:
    # flyway owns the schema, hibernate just checks the entities line up with it
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # a message that will not parse gets skipped instead of retried forever,
        # which would block everything behind it
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.ashish.contracts
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # consumers say what type they want, so no need to stamp the java class name on the message
        spring.json.add.type.headers: false
        interceptor.classes: dev.ashish.common.CorrelationProducerInterceptor
        # default is 60s, which parks the poller thread for a whole minute when the
        # broker is away. better to give up quickly and let the next poll try again
        max.block.ms: 5000

# how often the poller looks for messages waiting to go out
outbox:
  poll-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    # the kafka client logs its whole config every time it connects, too noisy
    org.apache.kafka: warn
