server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
  jpa:
    # flyway owns the schema, hibernate just checks the entities line up with it
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # consumers say what type they want, so no need to stamp the java class name on the message
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health
